site_name: MPP
site_url: https://moldyn.github.io/MPP/
site_description: Lumping tool for Markov state trajectories using the Most Probable Path algorithm
repo_url: https://github.com/moldyn/MPP
repo_name: moldyn/MPP

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - CLI Usage: usage_cli.md
  - Python API: usage_api.md
  - Snakemake Workflow: usage_snakemake.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
